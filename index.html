
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ KHATA BOOK</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f2f6f3;color:#18372c}
header{background:#123c32;color:white;padding:22px 16px}
main{max-width:650px;margin:auto;padding:15px}
.card{background:white;padding:15px;margin:12px 0;border-radius:14px}
input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;font-size:16px}
input,select{border:1px solid #ccd8d0}
button{border:0;background:#176344;color:white;font-weight:bold}
.small{color:#52665b;font-size:13px}
.person{padding:12px 0;border-bottom:1px solid #ddd}
.amount{font-weight:bold;color:#b42318}
</style>
</head>
<body>
<header>
  <h1>AJ KHATA BOOK</h1>
  <div>AJ DIGITAL POINT · उधार-जमा हिसाब</div>
</header>
<main>
  <div class="card">
    <b>कुल ग्राहक:</b> <span id="count">0</span><br>
    <b>कुल उधार बाकी:</b> <span id="total">₹0</span>
  </div>

  <div class="card">
    <h3>नया ग्राहक जोड़ें</h3>
    <input id="name" placeholder="ग्राहक का नाम">
    <input id="phone" placeholder="मोबाइल नंबर (वैकल्पिक)">
    <button onclick="addCustomer()">ग्राहक सेव करें</button>
  </div>

  <div class="card">
    <h3>लेन-देन दर्ज करें</h3>
    <select id="customer"></select>
    <select id="type">
      <option value="udhar">उधार दिया / बिक्री</option>
      <option value="jama">जमा मिला / भुगतान</option>
    </select>
    <input id="amount" type="number" min="0.01" step="0.01"
           placeholder="रकम ₹">
    <input id="note" placeholder="विवरण (वैकल्पिक)">
    <button onclick="addEntry()">एंट्री सेव करें</button>
  </div>

  <div class="card">
    <h3>ग्राहकों का हिसाब</h3>
    <div id="list"></div>
  </div>

  <div class="card">
    <h3>बैकअप</h3>
    <button onclick="backup()">हिसाब बैकअप डाउनलोड करें</button>
    <p class="small">
      डेटा इस ब्राउज़र में सेव होता है। फोन बदलने या ब्राउज़र
      डेटा मिटाने से पहले बैकअप लें।
    </p>
  </div>
</main>

<script>
const KEY = "AJ_KHATA_BOOK_NEW";
let db = {customers: [], entries: []};

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && Array.isArray(saved.customers)
      && Array.isArray(saved.entries)) db = saved;
} catch(e) {}

function save() {
  localStorage.setItem(KEY, JSON.stringify(db));
  render();
}

function money(n) {
  return "₹" + Number(n).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

function balance(id) {
  return db.entries
    .filter(e => e.customerId === id)
    .reduce((sum,e) => sum +
      (e.type === "udhar" ? e.amount : -e.amount), 0);
}

function addCustomer() {
  const name = document.getElementById("name").value.trim();
  if (!name) return alert("ग्राहक का नाम लिखें।");

  db.customers.push({
    id: Date.now().toString() + Math.random(),
    name,
    phone: document.getElementById("phone").value.trim()
  });

  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  save();
}

function addEntry() {
  const id = document.getElementById("customer").value;
  const amount = Number(document.getElementById("amount").value);

  if (!id) return alert("पहले ग्राहक जोड़ें।");
  if (!Number.isFinite(amount) || amount <= 0)
    return alert("सही रकम लिखें।");

  db.entries.push({
    id: Date.now().toString() + Math.random(),
    customerId: id,
    type: document.getElementById("type").value,
    amount,
    note: document.getElementById("note").value.trim(),
    date: new Date().toLocaleDateString("en-CA")
  });

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  save();
}

function render() {
  const select = document.getElementById("customer");
  const previous = select.value;

  select.innerHTML = db.customers.map(c =>
    `<option value="${c.id}">${escapeText(c.name)}</option>`
  ).join("");

  if (db.customers.some(c => c.id === previous))
    select.value = previous;

  const total = db.customers.reduce((sum,c) =>
    sum + Math.max(0, balance(c.id)), 0);

  document.getElementById("count").textContent =
    db.customers.length;
  document.getElementById("total").textContent = money(total);

  document.getElementById("list").innerHTML =
    db.customers.map(c => {
      const b = balance(c.id);
      const entries = db.entries
        .filter(e => e.customerId === c.id)
        .slice().reverse().map(e =>
          `<div class="small">${escapeText(e.date)} ·
          ${e.type === "udhar" ? "उधार" : "जमा"}:
          ${money(e.amount)} ${escapeText(e.note)}</div>`
        ).join("");

      return `<div class="person">
        <b>${escapeText(c.name)}</b>
        <div class="small">${escapeText(c.phone)}</div>
        <div class="${b > 0 ? "amount" : ""}">
          ${b > 0 ? money(b) + " बाकी" :
            b < 0 ? money(-b) + " अग्रिम" : "हिसाब बराबर"}
        </div>${entries}
      </div>`;
    }).join("") || "अभी ग्राहक नहीं हैं।";
}

function escapeText(value) {
  return String(value || "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"})[c]);
}

function backup() {
  const blob = new Blob(
    [JSON.stringify(db, null, 2)],
    {type:"application/json"}
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "AJ-Khata-Backup.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

render();
</script>
</body>
</html>
